[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dodoclaw"
version = "0.5.0"
description = "DoDoClaw — Dota 2 voice coach assistant (GSI + STT + LLM + TTS + reminders)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DoDoClaw" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "sounddevice>=0.5.1",
    "numpy>=2.1.0",
    "customtkinter>=5.2.2",
    "packaging>=24.0",
]

[project.optional-dependencies]
# Local speech stack (optional; heavier installs)
speech = [
    "faster-whisper>=1.0.3",
    "edge-tts>=6.1.12",
    "pygame>=2.6.0",
]
# Desktop packaging extras
app = [
    "customtkinter>=5.2.2",
    "pyinstaller>=6.0.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
dodoclaw = "dodoclaw.main:main"
dodoclaw-gui = "dodoclaw.gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
